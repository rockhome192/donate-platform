packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks dependency build scripts by default. These four genuinely need
# theirs: Prisma to generate its client and fetch query engines, esbuild and
# sharp to download native binaries.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
